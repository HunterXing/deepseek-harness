# 自建桌面产物流水线。
#
# 上游 deepseek-ai/deepseek-harness 的桌面打包流水线在 macOS 上强制要求
# 签名与公证凭据（electron-builder.config.mjs 的 forceCodeSigning / notarize
# 在配置加载期就硬校验），本机没有付费 Apple 开发者账号时无法直接使用。
# 这里在**构建期**对 4 个打包脚本打上临时补丁（.ci/unsigned-macos.patch），
# 产出未签名产物，打完即弃——工作树永远是干净的，与上游逐字节一致，
# 因此 sync-upstream 的 `git merge --ff-only` 永远能跑。
#
# 签名凭据一旦具备（Apple Developer Program），删掉 patch 步骤并把
# CSC_LINK / CSC_KEY_PASSWORD / APPLE_API_KEY / APPLE_API_KEY_ID /
# APPLE_API_ISSUER 配成 repository secrets 即可切回官方签名流程。

name: Build desktop artifacts

on:
  push:
    branches: [master]
  workflow_dispatch:

# 公开仓库的 GitHub 托管 runner 免费且不限量；改私有会开始计费，
# 且 macOS runner 按 10 倍分钟倍率计算。
permissions:
  contents: read

concurrency:
  group: desktop-build
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    # macos-*-intel 是原生 x64 runner（4 vCPU / 14GB），
    # macos-* 是原生 arm64（M1，3 vCPU / 7GB）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-x64
            os: macos-15-intel
            platform: macOS
          - target: mac-arm64
            os: macos-15
            platform: macOS
          - target: win-x64
            os: windows-latest
            platform: Windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # 注意：这里**不能**加 job 级 if 来筛选目标。GitHub 在矩阵展开**之前**求值
    # jobs.<id>.if，matrix 上下文尚不存在，会报
    #   Unrecognized named-value: 'matrix'
    # 需要按目标筛选只能在 step 级做（那里 matrix 可用）。

    steps:
      - uses: actions/checkout@v5
        with:
          # 浅历史足够：构建只需要 HEAD，体积从 ~1.3GB 降到几百 MB。
          # 完整历史是 sync-upstream 的需求，不是构建的。
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: pnpm

      - name: 记录 runner 规格与磁盘余量
        shell: bash
        run: |
          echo "### Runner 规格" >> "$GITHUB_STEP_SUMMARY"
          echo "- label: \`${{ matrix.os }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目标: \`${{ matrix.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const os=require("os");console.log(`- 环境: \`${process.version}\` / ${os.platform()} ${os.arch()} / ${os.cpus().length} vCPU / ${(os.totalmem()/2**30).toFixed(1)}GB RAM`)' >> "$GITHUB_STEP_SUMMARY"
          # df 在 Windows 的 git-bash 上不可靠，失败不阻断
          df -h . 2>/dev/null | tail -1 | awk '{print "- 工作盘可用: **"$4"** (总计 "$2")"}' >> "$GITHUB_STEP_SUMMARY" || echo "- 磁盘信息不可用" >> "$GITHUB_STEP_SUMMARY"

      # pnpm/action-setup 会读取根 package.json 的 packageManager 字段（pnpm@11.7.0），
      # 必须在 setup-node 之前：setup-node 的 cache: pnpm 依赖 PATH 里已有 pnpm。
      - name: 准备 .env.macos
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          # 模板里全空的签名字段保持为空 => --unsigned 产物。
          # 这些值都是本仓库自建的非敏感测试配置，**不含任何真实凭据**。
          # 注意：不要写本机代理（runner 上没有），否则下载会全部失败。
          # 模板在 apps/desktop/ 下，不在仓库根 —— 写错路径会 cp 失败
          cp apps/desktop/.env.macos.example apps/desktop/.env.macos
          cat >> apps/desktop/.env.macos <<'ENVEOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness.local
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.deepseek.com
          DOWNLOAD_TEST_RELEASE_ID=b5d774e5197c64a963fffb69350e0edb
          DSH_DESKTOP_MACOS_PACK_CONCURRENCY=4
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.com"]}'
          ENVEOF
          echo "写入的配置："
          grep -vE '^\s*#|^\s*$' apps/desktop/.env.macos | tail -9

      - name: 准备 .env.windows
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          # 与 macOS 同理：模板在 apps/desktop/ 下，不在仓库根。
          # 签名字段保持为空 —— win-x64 --unsigned 是上游自带的免凭据路径。
          # 不要往这里加 DSH_DESKTOP_UPDATE_FEED_URL：desktop-package-environment.mjs
          # 的 SHARED_SETTING/WINDOWS_SETTING 白名单不接受它，会直接抛错中止构建。
          # feed 地址由免签名补丁里的默认值按 target 推导，不需要注入。
          cp apps/desktop/.env.windows.example apps/desktop/.env.windows
          cat >> apps/desktop/.env.windows <<'ENVEOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness.local
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.deepseek.com
          DOWNLOAD_TEST_RELEASE_ID=b5d774e5197c64a963fffb69350e0edb
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.com"]}'
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          ENVEOF
          echo "写入的配置："
          grep -vE '^\s*#|^\s*$' apps/desktop/.env.windows | tail -9

      - name: 免签名补丁（构建期应用，产物生成后工作树不保留）
        shell: bash
        run: |
          set -euo pipefail
          # 三个平台都要打：补丁里的 desktop-auto-update-environment.mjs 提供了按 target
          # 推导的 feed 默认值，Windows 同样依赖它，且该文件是 SHARED_SETTING 白名单
          # 不允许通过 .env 注入的。仓库 .gitattributes 强制 eol=lf，Windows 上
          # checkout 出来的就是 LF，git apply 不会因 CRLF 失败。
          # 上游一旦改动这 8 个文件，这里会响亮失败——这是刻意设计：
          # 宁可构建中止，也不要产出一个悄悄跑偏的包。修复办法见 .ci/README.md
          # set -e 是关键：没有它，git apply 失败后步骤照样「成功」，
          # 构建会带着未打补丁的源码跑完，产出一个看起来正常但功能缺失的包。
          git apply --check -p1 .ci/unsigned-macos.patch
          git apply -p1 .ci/unsigned-macos.patch
          echo "已打补丁的文件："
          git status --porcelain | grep -E '^( M|\?\?)' | sed 's/^/  /'
          # 逐个核对补丁声明的 5 个路径。不能用「数一下有多少个改动文件」代替：
          # 新增的 update-replace.ts 在 git status 里是 ?? 而不是 M，
          # 计数会把补丁整体少算一个，断言自己就成了摆设。
          #
          # 2026-10-10：原为 9 个路径。免签名相关的 4 个文件
          # （electron-builder-config / package-target / prepare-dsh /
          # smoke-packaged-runtime）已由上游自己实现并重写，补丁不再需要；
          # 保留的是 dsh 独有能力：自研 bundle 替换、HTTP/2 与 QUIC 禁用、
          # Windows tar 路径修复、更新 feed 地址推导。
          MISSING=0
          for f in apps/desktop/scripts/desktop-auto-update-environment.mjs \
                   apps/desktop/scripts/prepare-package-set.ts \
                   apps/desktop/src/main.ts \
                   apps/desktop/src/update-coordinator.ts \
                   apps/desktop/src/update-replace.ts; do
            if ! git status --porcelain -- "$f" | grep -q .; then
              echo "::error::补丁没有改动 $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::补丁声明的 5 个文件里有 $MISSING 个未被改动，补丁与预期不符"
            exit 1
          fi
          for f in apps/desktop/scripts/prepare-package-set.ts; do
            node --check "$f" 2>/dev/null || npx --no-install tsc --noEmit --skipLibCheck "$f" 2>/dev/null || true
          done
          echo "语法检查完成"

      # 上游要求 build version 形如 <productVersion>.<date>.<sequence>。
      # 不传 --build-version 时 extraMetadata.version 不会被注入，产物的
      # app.getVersion() 会停在 productVersion，发布出去的更新永远「不是最新」。
      # GITHUB_RUN_NUMBER 单调递增，保证新构建的版本恒大于已安装的版本。
      - name: 计算构建版本
        id: bver
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./apps/desktop/package.json').version")
          VER="${BASE}.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "构建版本: $VER"
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      - name: 构建 ${{ matrix.target }}
        shell: bash
        env:
          # GitHub 托管 runner 在美国，默认源即可；不设 npmmirror 以免绕远。
          ELECTRON_MIRROR: ''
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            mac-x64)   pnpm run package:desktop:mac:x64   -- --unsigned --dir --build-version "${{ steps.bver.outputs.value }}" ;;
            mac-arm64) pnpm run package:desktop:mac:arm64 -- --unsigned --dir --build-version "${{ steps.bver.outputs.value }}" ;;
            # 上游自带免凭据脚本：package:win:x64:unsigned == package-target.ts win-x64 --unsigned
            win-x64)   pnpm run package:desktop:win:x64:unsigned -- --build-version "${{ steps.bver.outputs.value }}" ;;
            *) echo "未知目标"; exit 1 ;;
          esac
          echo "--- 构建自述里的版本（唯一可信来源）---"
          find apps/desktop/.desktop-build/packaging-runs -name '*.json' -newermt '-30 minutes' \
            -exec grep -o '"version":"[^"]*"' {} \; | sort -u

      - name: 收集产物（macOS）
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="apps/desktop/.desktop-build/targets"
          APP="$(find "$ROOT" -name 'DeepSeek Harness.app' -maxdepth 4 -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::未找到 .app 产物"; find "$ROOT" -maxdepth 3 | head -40; exit 1
          fi
          echo "找到产物：$APP ($(du -sh "$APP" | cut -f1))"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | sed 's/^/  版本: /'
          lipo -archs "$APP/Contents/MacOS/DeepSeek Harness" | sed 's/^/  架构: /'
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          # 发布前自检：Info.plist 的版本必须等于我们请求的 --build-version。
          # 不一致说明 extraMetadata 没生效，产物会带着 productVersion 出去，
          # 结果是所有客户端永远提示有新版。
          if [ "$VER" != "${{ steps.bver.outputs.value }}" ]; then
            echo "::error::Info.plist 版本 [$VER] 与请求的 --build-version [${{ steps.bver.outputs.value }}] 不一致，拒绝发布"
            exit 1
          fi
          echo "版本自检通过：$VER"
          # 文件名带版本号：electron-updater 靠把 URL 里的新版本号替换成旧版本号
          # 来定位上一版的 blockmap，名字里没有版本号差分就退化成全量下载。
          OUT="out/dsh-${{ matrix.target }}-${VER}.zip"
          mkdir -p out
          # 必须用 ditto 打包：actions/upload-artifact 解包后会丢失可执行位和符号链接，
          # 直接上传 .app 目录会得到一个打不开的 app。
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"

          # 差分更新需要 blockmap。electron-updater 的 MacUpdater 只有拿到
          # <artifact>.blockmap 才会走 differentialDownloadInstaller，否则整包重下；
          # 而构建走 --dir + ditto，electron-builder 自己没产 zip，也就不会附带它。
          # 生成的 .blockmap 与 zip 一起上传，electron-updater 按
          # <files[].url>.blockmap 定位，文件名对得上。
          node .ci/make-blockmap.mjs "$OUT"
          test -s "$OUT.blockmap" || { echo "::error::blockmap 未生成"; exit 1; }

          # 生成 electron-updater 读取的清单。Squirrel.Mac 会按 sha512 校验下载到的 zip，
          # 字段名/层级必须与 electron-builder 产出的一致。
          NAME=$(basename "$OUT")
          FEED="https://github.com/HunterXing/deepseek-harness/releases/download/ci-${{ matrix.target }}/"
          SHA=$(openssl dgst -sha512 -binary "$OUT" | openssl base64 -A)
          SIZE=$(stat -f '%z' "$OUT")
          cat > out/latest-mac.yml <<YML
          version: $VER
          files:
            - url: ${FEED}$NAME
              sha512: $SHA
              size: $SIZE
          path: $NAME
          sha512: $SHA
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          YML
          echo "--- 生成的清单 ---"; sed 's/^/  /' out/latest-mac.yml
          echo "--- app-update.yml 是否已写入（这是更新器 enabled() 的判据）---"
          test -f "$APP/Contents/Resources/app-update.yml" \
            && sed 's/^/  /' "$APP/Contents/Resources/app-update.yml" \
            || { echo "  ::error::app-update.yml 未生成，OTA 不通"; exit 1; }
          ls -la out/

      - name: 收集产物（Windows）
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          EXE="$(find apps/desktop/.desktop-build/targets -name '*.exe' -type f | head -1)"
          if [ -z "$EXE" ]; then
            echo "::error::未找到 .exe 产物"; find apps/desktop/.desktop-build/targets -maxdepth 3 | head -40; exit 1
          fi
          echo "找到产物：$EXE ($(du -sh "$EXE" | cut -f1))"
          # 版本取自构建自述，不取仓库 package.json —— 后者只是 productVersion，
          # 少了构建后缀，发布出去的清单会让所有已装客户端永远看到「有新版」。
          VER="${{ steps.bver.outputs.value }}"
          RECORDED=$(find apps/desktop/.desktop-build/packaging-runs -name '*.json' -newermt '-60 minutes' \
            -exec grep -o '"version":"[^"]*"' {} \; | head -1 | cut -d'"' -f4)
          if [ "$RECORDED" != "$VER" ]; then
            echo "::error::构建自述版本 [$RECORDED] 与传入的 --build-version [$VER] 不一致，拒绝发布"
            exit 1
          fi
          echo "版本自检通过：$VER"
          # 文件名带版本号是差分更新的前提：electron-updater 靠把 URL 里的新版本号
          # 替换成旧版本号来定位上一版的 blockmap。
          NAME="dsh-${{ matrix.target }}-${VER}.exe"
          cp "$EXE" "out/$NAME"
          # NSIS 的 blockmap 是**内嵌在 exe 末尾**的（electron-updater 走
          # FileWithEmbeddedBlockMapDifferentialDownloader，从末尾读 blockMapSize+4 字节，
          # 末 4 字节是 deflateRaw 压缩块长度的 BE 头），没有独立的 .exe.blockmap 文件。
          # 构建时是 --publish never，electron-builder 不会自动追加，所以这里自己来。
          # 顺序不能颠倒：内嵌会让文件变大，sha512 与 size 必须在它之后算。
          BMAP_SIZE=$(node .ci/make-blockmap.mjs --embed "out/$NAME" | sed -n 's/^blockMapSize=//p')
          if [ -z "$BMAP_SIZE" ] || [ "$BMAP_SIZE" -le 0 ]; then
            echo "::error::未能内嵌 blockmap（blockMapSize=$BMAP_SIZE）"
            exit 1
          fi
          echo "内嵌 blockmapSize: $BMAP_SIZE"
          FEED="https://github.com/HunterXing/deepseek-harness/releases/download/ci-${{ matrix.target }}/"
          SHA=$(openssl dgst -sha512 -binary "out/$NAME" | openssl base64 -A)
          SIZE=$(stat -c '%s' "out/$NAME" 2>/dev/null || wc -c < "out/$NAME")
          cat > out/latest.yml <<YML
          version: $VER
          files:
            - url: ${FEED}$NAME
              sha512: $SHA
              size: $SIZE
              blockMapSize: $BMAP_SIZE
          path: $NAME
          sha512: $SHA
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          YML
          sed 's/^/  /' out/latest.yml
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.target }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: 构建后磁盘用量
        if: always()
        shell: bash
        run: df -h . 2>/dev/null | tail -1 | awk '{print "工作盘已用 "$3" / "$2"  可用 "$4}' | tee -a "$GITHUB_STEP_SUMMARY" || echo "磁盘信息不可用" | tee -a "$GITHUB_STEP_SUMMARY"

  # 产物默认只落在 Actions artifact（30 天过期、藏在 run 页面里），
  # 这里再发一份到 Releases：有稳定 URL、可长期保留、其他机器/脚本能直接引用，
  # 也正好是自更新功能将来要用的版本源。
  # 产物默认只落在 Actions artifact（30 天过期、藏在 run 页面里）。
  # 这里按架构各发一个 Release：tag 固定为 ci-<target>，每次构建覆盖同一份，
  # 于是得到一个稳定的扁平地址，正好当 electron-updater 的 feed：
  #   <feed>latest-mac.yml   清单（含 zip 的 sha512 与下载地址）
  #   <feed>dsh-mac-x64-<日期>.zip
  publish-release:
    name: 发布 ${{ matrix.target }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [mac-x64, mac-arm64, win-x64]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 下载该架构的产物
        uses: actions/download-artifact@v4
        with:
          name: dsh-${{ matrix.target }}
          path: dist

      - name: 读取构建版本
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # 从清单读，而不是仓库 package.json —— 后者是 productVersion，
          # 少了构建后缀，Release 标题会长期显示一个比产物旧的版本。
          # 逐个判断存在性，不用 `ls a b`：只要其中任意一个不存在，ls 就返回 2，
          # 而 set -e 会在命令替换处直接中止整个步骤，后面的空值检查根本走不到。
          YML=""
          for candidate in dist/latest-mac.yml dist/latest.yml; do
            if [ -f "$candidate" ]; then YML="$candidate"; break; fi
          done
          if [ -z "$YML" ]; then
            echo "::error::产物里没有 electron-updater 清单"; ls -la dist/; exit 1
          fi
          VER=$(grep -m1 '^version:' "$YML" | awk '{print $2}')
          if [ -z "$VER" ]; then
            echo "::error::清单 $YML 里没有 version 行"; exit 1
          fi
          echo "清单: $YML"
          echo "构建版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 待发布文件
        run: ls -la dist/

      - name: 创建 / 覆盖 Release ci-${{ matrix.target }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ matrix.target }}
          name: ${{ matrix.target }} ${{ steps.ver.outputs.version }}
          body: |
            由 `build-desktop.yml` 自动构建并覆盖发布。

            - 构建 commit：`${{ github.sha }}`
            - 运行时版本：`${{ steps.ver.outputs.version }}`
            - 更新源：<https://github.com/HunterXing/deepseek-harness/releases/download/ci-${{ matrix.target }}/>

            **产物未签名。** macOS 首次打开需右键 → 打开绕过 Gatekeeper；
            未走官方公证，因此不进入系统「安全与隐私 → 已允许下载的应用」列表。
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
